name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verification dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq make curl python3 python3-venv python3-pip
          python3 -m venv venv
          touch venv/.gdignore
          venv/bin/python3 -m pip install -r scripts/requirements.txt

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Run make check
        run: make check
